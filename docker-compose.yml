services:
  # ===========================================================================
  # 1. MongoDB Database Service
  # ===========================================================================
  mongodb:
    image: mongo:6.0
    container_name: taskmanager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume — task data persists across `docker compose down` restarts
      - mongodb_data:/data/db
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===========================================================================
  # 2. Node.js / Express API Backend Service
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # NOTE: the backend container uses the Docker service name "mongodb"
      # as the hostname — NOT "localhost".  Inside Docker's bridge network,
      # each service is reachable by its service name.
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=hemangi_taskmanager_docker_secret_2026
      - NODE_ENV=production
      - ADMIN_EMAILS=24aiml026@charusat.edu.in
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskmanager-network

  # ===========================================================================
  # 3. React Frontend Service  (multi-stage Nginx image)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the API at this URL — must be accessible
        # from the user's browser, NOT from inside the container.
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    container_name: taskmanager-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - taskmanager-network

# =============================================================================
# Named Volumes — data survives container restarts
# =============================================================================
volumes:
  mongodb_data:
    name: taskmanager_mongodb_data
    driver: local

# =============================================================================
# Internal Bridge Network — containers talk to each other by service name
# =============================================================================
networks:
  taskmanager-network:
    name: taskmanager_internal_network
    driver: bridge
