server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # React Router SPA support:
    # Any URL that doesn't match a real file falls back to index.html
    # so client-side routing (/dashboard, /tasks, /login etc.) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed static assets (JS/CSS chunks, images)
    # Vite adds content hashes to filenames, so 1-year caching is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
